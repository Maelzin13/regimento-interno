<ion-header class="ion-no-border transparent">
  <ion-toolbar id="toolbar">
    <ion-title class="header-title" style="text-align: center;">{{ nameApp }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen="true" scroll-y="true">
  <div class="center-container">
    <ion-card class="login-card">
      <ion-card-content>

        <!-- Nome -->
        <ion-item lines="inset">
          <ion-icon name="person-outline" slot="start"></ion-icon>
          <ion-input type="text" placeholder="Nome completo" [(ngModel)]="name"
            label="Nome" label-placement="floating" autocomplete="name">
          </ion-input>
        </ion-item>

        <!-- Email -->
        <ion-item lines="inset" class="ion-margin-top">
          <ion-icon name="mail-outline" slot="start"></ion-icon>
          <ion-input type="email" placeholder="Email" [(ngModel)]="email"
            label="Email" label-placement="floating" autocomplete="email">
          </ion-input>
        </ion-item>

        <!-- Senha -->
        <ion-item lines="inset" class="ion-margin-top">
          <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
          <ion-input type="password" placeholder="Senha" [(ngModel)]="password"
            label="Senha" label-placement="floating">
          </ion-input>
        </ion-item>

        <!-- Confirmar Senha -->
        <ion-item lines="inset" class="ion-margin-top">
          <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
          <ion-input type="password" placeholder="Confirmar Senha" [(ngModel)]="password_confirmation"
            label="Confirmar Senha" label-placement="floating">
          </ion-input>
        </ion-item>

        <!-- Botão de cadastro -->
        <ion-button expand="block" class="login-btn ion-margin-top" >
          Cadastrar
        </ion-button>

        <!-- Link para login -->
        <div class="ion-text-center ion-margin-top">
          <ion-text>
            Já tem uma conta?
            <ion-button fill="clear" size="small" >
              Entrar
            </ion-button>
          </ion-text>
        </div>

      </ion-card-content>
    </ion-card>
  </div>
</ion-content>

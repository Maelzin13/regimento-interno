<ion-header>
  <ion-toolbar id="toolbar">
    <ion-buttons slot="start">
      <ion-button (click)="dismiss()" color="light">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Nova Questão</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="dismiss()" fill="clear" color="light">
        <ion-icon name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" id="content">
  <div>
    <ion-card class="ion-padding">
      <ion-item>
       <ion-input [(ngModel)]="item.titulo"
       label="Título"
       labelPlacement="floating"
       type="text"></ion-input>
      </ion-item>

      <br>
 
      <ion-item>
       <ion-textarea
         [autoGrow]="true"
         [(ngModel)]="item.descricao"
         label="Descrição"
         labelPlacement="floating"
       >
       </ion-textarea>
     </ion-item>
    </ion-card>

    <!-- Botões de ação -->
    <div class="ion-padding">
      <ion-button expand="block" (click)="salvarConteudo()" color="primary">
        <ion-icon name="save-outline" slot="start"></ion-icon>
        Salvar
      </ion-button>
      
      <ion-button expand="block" (click)="dismiss()" fill="outline" color="medium" class="ion-margin-top">
        <ion-icon name="close-outline" slot="start"></ion-icon>
        Cancelar
      </ion-button>
    </div>
  </div>
</ion-content>

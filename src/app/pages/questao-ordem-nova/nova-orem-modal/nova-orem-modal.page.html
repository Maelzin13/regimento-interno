<ion-header>
  <ion-toolbar id="toolbar">
    <ion-buttons slot="start">
      <ion-button (click)="dismiss()"><ion-icon name="arrow-back-outline"></ion-icon></ion-button>
    </ion-buttons>
    <ion-title>Nova Questão</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" id="content">
  <div>
    <ion-card class="ion-padding">
      <ion-item>
       <ion-input [(ngModel)]="item.titulo"
       label="Título"
       labelPlacement="floating"
       type="text"></ion-input>
      </ion-item>

      <br>
 
      <ion-item>
       <ion-textarea
         [autoGrow]="true"
         [(ngModel)]="item.descricao"
         label="Descrição"
         labelPlacement="floating"
       >
       </ion-textarea>
     </ion-item>
    </ion-card>

    <ion-button expand="block" (click)="salvarConteudo()">Salvar</ion-button>
  </div>
</ion-content>

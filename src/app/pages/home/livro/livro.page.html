<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar id="toolbar">
    <ion-title class="section-label">
      Regimento Comentado
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-card-content>
    <section class="section">
      <ng-container *ngIf="!isLoading && books?.length">
        <ion-grid *ngFor="let book of books" >
          <ion-row [routerLink]="['/view-text', book.id]">
            <ion-col class="menu-item-livro">
              <div>
                <h2> <strong>Regimento interno Comentado</strong></h2>
                <p class="auxiliares-text">1ª Edição 2025</p>
              </div>
            </ion-col>
          </ion-row>
        </ion-grid>
      </ng-container>
    </section>

    <div class="dashboard-title">
      <span>Acontece na Câmara Agora</span>
    </div>

    <ion-grid>
      <ion-row>
        <ion-col size="4" class="textos-item">
          <a class="textos-auxiliares-box text-center" href="https://www.camara.leg.br/plenario" target="_blank" style="text-decoration: none;">
            <div class="auxiliares-text link-text">No plenário</div>
          </a>
        </ion-col>
        <ion-col size="4" class="textos-item">
          <a class="textos-auxiliares-box text-center" href="https://www.camara.leg.br/presenca-comissoes/painel.comissoes" target="_blank" style="text-decoration: none;">
            <div class="auxiliares-text link-text">Nas comissões</div>
          </a>
        </ion-col>
        <ion-col size="4" class="textos-item">
          <a class="textos-auxiliares-box text-center" href="https://www.camara.leg.br/presenca-comissoes/painel.comissoes" target="_blank" style="text-decoration: none;">
            <div class="auxiliares-text link-text">Questões novas e atualizações</div>
          </a>
        </ion-col>
      </ion-row>
    </ion-grid>

    <div class="dashboard-title">
      <span>Textos Auxiliares</span>
    </div>

    <ion-grid>
      <ion-row>
        <ion-col size="4" *ngFor="let texto of textos" class="menu-item">
          <div class="textos-auxiliares-box text-center" (click)="openDescricaoModal(texto)" *ngIf="!texto.link; else externalLink">
            <ion-icon name="document-text-outline" color="primary" class="icon-large"></ion-icon>
            <div class="auxiliares-text">{{ cleanHTML(texto.title) }}</div>
          </div>
          <ng-template #externalLink>
            <a class="textos-auxiliares-box text-center" [href]="texto.link" target="_blank" style="text-decoration: none;">
              <ion-icon name="document-text-outline" color="primary" class="icon-large"></ion-icon>
              <div class="auxiliares-text">{{ cleanHTML(texto.title) }}</div>
            </a>
          </ng-template>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-card-content>
</ion-content>

<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar id="toolbar">
    <ion-title class="section-label">
      Regimento Comentado
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-card-content>
  <section class="section">
    <ng-container *ngIf="!isLoading && books?.length" >
      <ion-grid *ngFor="let book of books">
        <ion-row [routerLink]="['/view-text', book.id]">
          <ion-col size="12" class="pill-card">
            <ion-card-content class="card-content-custom">
              <h2> <strong>Regimento interno Comentado</strong></h2>
              <p class="menu-text">1ª Edição 2025</p>
            </ion-card-content>
          </ion-col>
        </ion-row>
      </ion-grid>
    </ng-container>
  </section>

  <!-- ACONTECE NA CÂMARA -->
  <section class="section">
    <div class="section-title">
      <ion-icon name="calendar-outline"></ion-icon>
      <h2>Acontece na Câmara agora</h2>
    </div>

    <ion-grid class="quick-actions">
      <ion-row>
        <ion-col size="5">
          <ion-button expand="block" fill="outline" shape="round" href="https://www.camara.leg.br/plenario" target="_blank">
            <ion-icon name="home-outline" slot="start"></ion-icon>
            Plenário
          </ion-button>
        </ion-col>
        <ion-col size="5">
          <ion-button expand="block" fill="outline" shape="round" href="https://www.camara.leg.br/presenca-comissoes/painel.comissoes" target="_blank">
            <ion-icon name="people-outline" slot="start"></ion-icon>
            Comissões
          </ion-button>
        </ion-col>
        <ion-col size="5">
          <ion-button expand="block" fill="outline" shape="round" [routerLink]="['/questao-ordem-nova']">
            <ion-icon name="help-buoy-outline" slot="start"></ion-icon>
            Q.O. Novas
          </ion-button>
        </ion-col>
      </ion-row>
    </ion-grid>
  </section>

  <!-- TEXTOS AUXILIARES (carrossel) -->
    <section class="section">
      <div class="section-title">
        <ion-icon name="library-outline"></ion-icon>
        <h2>Textos auxiliares</h2>
      </div>

      <div class="page-snap" role="list">
        <div class="page" *ngFor="let chunk of textos | slice:0; let i = index">
          <ng-container *ngFor="let texto of textos | slice:(i*4):(i*4+4)">
            <ng-container *ngIf="texto">
              <button class="page-card" *ngIf="!texto.link; else external2"
                      (click)="openDescricaoModal(texto)">
                <ion-icon name="document-text-outline"></ion-icon>
                <span>{{ cleanHTML(texto.title) }}</span>
              </button>
              <ng-template #external2>
                <a class="page-card" [href]="texto.link" target="_blank" rel="noopener">
                  <ion-icon name="document-text-outline"></ion-icon>
                  <span class="link">{{ cleanHTML(texto.title) }}</span>
                </a>
              </ng-template>
            </ng-container>
          </ng-container>
        </div>
      </div>
    </section>
  </ion-card-content>
</ion-content>

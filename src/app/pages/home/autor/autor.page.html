<ion-content [fullscreen]="true" class="ion-padding">
  <ion-card class="profile-card">
    <ion-card-header>
      <div class="profile-header">
        <div class="profile-image-wrapper">
          <ion-img src="assets/autor.jpg" class="profile-image"></ion-img>
        </div>
        <div class="profile-info">
          <h3>Sobre o Autor</h3>
          <p>
            Secretário Executivo de Comissão na Câmara dos Deputados. Advogado, graduado em Filosofia, pós-graduado em Direito Público e Direito Constitucional. Autor do Regimento Interno Facilitado da Câmara dos Deputados.
          </p>
          <br>
          <ion-button expand="block" class="primary-btn" (click)="openLinke()">
            <ion-icon slot="start" name="link"></ion-icon>
            Fale com o Autor
          </ion-button>
        </div>
      </div>
    </ion-card-header>
  </ion-card>
</ion-content>

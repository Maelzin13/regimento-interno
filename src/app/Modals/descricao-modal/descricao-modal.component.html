<ion-header>
  <ion-toolbar id="toolbar">
    <ion-title>{{ titulo }}</ion-title>
    <ion-buttons slot="start">
      <ion-button (click)="fechar()">
        <ion-icon name="arrow-back" color="light"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <!-- Exibir descrição normal para outros casos -->
  <p *ngIf="titulo !== 'Atos da Mesa'">{{ (descricao | stripHtml) || 'Descrição indisponível.' }}</p>

  <!-- Exibir tabela de Atos da Mesa -->
  <div *ngIf="titulo === 'Atos da Mesa'" class="atos-mesa-container">
    <div class="tabela-atos">
      <table>
        <thead>
          <tr>
            <th colspan="3" class="tabela-titulo">ATOS DA MESA RELACIONADOS ÀS ATIVIDADES LEGISLATIVAS</th>
          </tr>
          <tr>
            <th>Nº</th>
            <th>ANO</th>
            <th>EMENTA</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let ato of atosMesaTable">
            <td>{{ ato.numero }}</td>
            <td>{{ ato.ano }}</td>
            <td>
              <a [href]="ato.link" target="_blank" class="ementa-link">
                {{ ato.ementa }}
              </a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div *ngIf="loadingAtosMesa" class="ion-text-center">
      <ion-spinner></ion-spinner>
      <p>Carregando dados...</p>
    </div>

    <div *ngIf="errorAtosMesa" class="ion-text-center error-message">
      <ion-icon name="alert-circle-outline" color="danger"></ion-icon>
      <p>{{ errorAtosMesa }}</p>
    </div>
  </div>
</ion-content>

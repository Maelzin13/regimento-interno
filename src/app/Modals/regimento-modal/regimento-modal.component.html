<ion-header>
  <ion-toolbar id="toolbar">
    <ion-title>
      {{ content[type]?.title }}
    </ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="dismiss()" color="primary">
        <ion-icon name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen class="modal-content-container">
  <div class="modal-content" [innerHTML]="content[type]?.content"></div>
</ion-content>
